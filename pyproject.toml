[project]
name = "misstep"
version = "0.1.0"
description = "Find the exact step where a student's algebra went wrong. Local, open-weight, verified."
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["sympy>=1.12", "fastapi>=0.110", "uvicorn>=0.29", "python-multipart>=0.0.9", "reportlab>=4.0", "pypdf>=4.0", "pillow>=10"]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[tool.pytest.ini_options]
pythonpath = ["."]
